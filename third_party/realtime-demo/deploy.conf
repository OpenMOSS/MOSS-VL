# deploy.conf — demo 部署布局配置（start_demo.sh / stop_demo.sh 读取）。
#
# 优先级：命令行 env > 本文件 > 脚本内建默认值。
# 例：临时覆盖 → OMNI_GPUS=0,1 bash start_demo.sh
#
# 所有服务都在 GPU 节点本地拉起；本文件只管「哪张卡放什么」。

# ---- MOSS-VL 推理实例（sglang-omni）----
# 一卡一实例（TP1）：OMNI_GPUS 里每张卡一个实例，端口 = OMNI_PORT_BASE + 序号
#   OMNI_GPUS="0"     → 1 实例 :18500 (GPU0)
#   OMNI_GPUS="0,2,3" → 3 实例 :18500/:18501/:18502 (GPU0/2/3)
# TP 模式：OMNI_GPUS="0,1" OMNI_TP_SIZE=2 → 1 个 TP2 实例 :18500 (GPU0+1)
# 注意：实例数变化时 start_demo.sh 会自动同步 .env.deploy 的 SGLANG_OMNI_URLS
OMNI_GPUS="${OMNI_GPUS:-0}"
OMNI_TP_SIZE="${OMNI_TP_SIZE:-1}"
OMNI_PORT_BASE="${OMNI_PORT_BASE:-18500}"

# 单实例多会话（GATEWAY_PLAN P2）：两个值必须一致——
#   MAX_RUNNING_REQUESTS            = 远端 omni 实例的 --max-running-requests
#   SGLANG_OMNI_SESSIONS_PER_REPLICA = 网关侧每副本 slot 数
# 单卡 KV 池 ÷ N = 每会话安全上下文；P5 压测（2026-09-04，reports/P5_summary.md）
# 实测单实例 8 会话全绿，这里取保守值 4，按真实负载可上探到 8。
MAX_RUNNING_REQUESTS="${MAX_RUNNING_REQUESTS:-4}"
SGLANG_OMNI_SESSIONS_PER_REPLICA="${SGLANG_OMNI_SESSIONS_PER_REPLICA:-4}"
export MAX_RUNNING_REQUESTS SGLANG_OMNI_SESSIONS_PER_REPLICA

# memory 文本 embedder：默认 bge-m3（P5 A/B 对比胜出，reports/embedder_ab.md），
# 模型缺失或加载失败时自动回落 hashing-ngram 兜底；空气隔离环境可显式设空关闭。
# 注意：切换 embedder 后旧向量的 dim 不匹配，旧会话的记忆行自然失效（不报错）。
MEMORY_EMBED_TEXT_MODEL="${MEMORY_EMBED_TEXT_MODEL:-$REPO/models/memory/bge-m3}"
export MEMORY_EMBED_TEXT_MODEL

# ---- memory decide/compact 后端（Qwen3-4B）----
# 短上下文 memory 工作负载；与主 VLM 的上下文/并发配置相互独立。
DECIDE_LLM_GPU="${DECIDE_LLM_GPU:-1}"
DECIDE_LLM_MEM_FRAC="${DECIDE_LLM_MEM_FRAC:-0.2}"
DECIDE_LLM_CONTEXT_LENGTH="${DECIDE_LLM_CONTEXT_LENGTH:-16384}"
DECIDE_LLM_MAX_RUNNING_REQUESTS="${DECIDE_LLM_MAX_RUNNING_REQUESTS:-4}"
DECIDE_LLM_MAX_TOTAL_TOKENS="${DECIDE_LLM_MAX_TOTAL_TOKENS:-65536}"
export DECIDE_LLM_GPU DECIDE_LLM_MEM_FRAC DECIDE_LLM_CONTEXT_LENGTH
export DECIDE_LLM_MAX_RUNNING_REQUESTS DECIDE_LLM_MAX_TOTAL_TOKENS
